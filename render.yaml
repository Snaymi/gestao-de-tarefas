services:
  - type: web
    name: fluxo-gestao-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run start:production
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fluxo-postgres
          property: connectionString

databases:
  - name: fluxo-postgres
    databaseName: fluxo
    user: fluxo_app
    postgresMajorVersion: '16'
    plan: free
    region: virginia
    ipAllowList: []
